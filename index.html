<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>для сони</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .heart {
            position: relative;
            width: 400px;
            height: 400px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .text-item {
            position: absolute;
            font-size: 14px;
            white-space: nowrap;
            font-weight: bold;
            
            animation: colorShift 3s infinite alternate;
        }

        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        
        @keyframes colorShift {
            0% {
                color: #ff0055;
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055;
            }
            33% {
                color: #00fbff;
                text-shadow: 0 0 10px #00fbff, 0 0 20px #00fbff;
            }
            66% {
                color: #ae00ff;
                text-shadow: 0 0 10px #ae00ff, 0 0 20px #ae00ff;
            }
            100% {
                color: #ffcc00;
                text-shadow: 0 0 10px #ffcc00, 0 0 20px #ffcc00;
            }
        }
    </style>
</head>
<body>

<div class="heart" id="heart"></div>

<script>
    const heartContainer = document.getElementById('heart');
    const text = "I love you";
    const totalItems = 100;

    for (let i = 0; i < totalItems; i++) {
        const t = i / totalItems * 2 * Math.PI;
        
        
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        
        const span = document.createElement('span');
        span.className = 'text-item';
        span.innerText = text;
        
        
        span.style.left = (x * 15 + 200) + 'px';
        span.style.top = (y * 15 + 200) + 'px';

        
        
        span.style.animationDelay = (i * 0.02) + 's';
        
        heartContainer.appendChild(span);
    }
</script>

</body>
</html>
